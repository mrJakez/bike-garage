<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Bike Garage</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1ea;color:#1d2423;font:16px system-ui,sans-serif}.card{width:min(390px,calc(100vw - 48px));padding:34px;border:1px solid #d8d2c7;border-radius:16px;background:#fff;box-shadow:0 12px 35px #1d24231c}h1{margin:0 0 10px}p{color:#5c6664;line-height:1.5}button{width:100%;padding:12px 16px;border:0;border-radius:8px;background:#24734b;color:#fff;font:inherit;font-weight:700;cursor:pointer}.error{color:#a33b2f}</style><main class="card"><h1>Bike Garage</h1>{% if configured %}<p>Use your passkey to sign in.</p><button id="passkey">Sign in with passkey</button><p id="status" aria-live="polite"></p>{% else %}<p>No passkey is configured. Enable registration in the container environment to initialize this garage.</p>{% endif %}</main>{% if configured %}{% include 'passkey_script.html' %}<script>startPasskeyFlow('login');</script>{% endif %}</html>
