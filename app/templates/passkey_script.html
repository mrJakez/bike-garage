<script>
const b64ToBuf=v=>{const s=(v+'='.repeat((4-v.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer};
const bufToB64=v=>btoa(String.fromCharCode(...new Uint8Array(v))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function browserOptions(o,mode){o.challenge=b64ToBuf(o.challenge);if(mode==='register'){o.user.id=b64ToBuf(o.user.id);o.excludeCredentials?.forEach(x=>x.id=b64ToBuf(x.id))}else{o.allowCredentials?.forEach(x=>x.id=b64ToBuf(x.id))}return o}
function credentialJson(c){const r=c.response,response={clientDataJSON:bufToB64(r.clientDataJSON)};for(const k of['attestationObject','authenticatorData','signature','userHandle'])if(r[k])response[k]=bufToB64(r[k]);return{id:c.id,rawId:bufToB64(c.rawId),type:c.type,response,clientExtensionResults:c.getClientExtensionResults()}}
async function startPasskeyFlow(mode){const button=document.querySelector('#passkey'),status=document.querySelector('#status');const run=async()=>{try{status.textContent='Opening passkey…';const options=await fetch('/auth/'+mode+'/options',{method:'POST'}).then(async r=>{if(!r.ok)throw Error((await r.json()).detail);return r.json()});const credential=mode==='register'?await navigator.credentials.create({publicKey:browserOptions(options,mode)}):await navigator.credentials.get({publicKey:browserOptions(options,mode)});const result=await fetch('/auth/'+mode+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentialJson(credential))});if(!result.ok)throw Error((await result.json()).detail);location.assign('/')}catch(error){status.textContent=error.message||'Passkey failed.';status.className='error'}};button.addEventListener('click',run);setTimeout(run,80)}
</script>
