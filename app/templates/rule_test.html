{% extends "base.html" %}{% block title %}Test rule · Bike Garage{% endblock %}{% block content %}<p class="eyebrow">RULES / TEST</p><h1>Test rule</h1><p class="lead">Choose an activity to inspect this rule.</p><form class="card form-card" method="post"><label>Activity<select name="activity_id" required>{% for activity in activities %}<option value="{{ activity.id }}" {% if selected_activity|default(0)|int == activity.id %}selected{% endif %}>{{ activity.name }} · {{ activity.started_at|activity_datetime }} · {{ activity.source_count }} source(s)</option>{% endfor %}</select></label><button type="submit">Run test</button></form>{% if result is defined %}<section class="card"><h2>Result</h2><p><code>{{ rule.expression }}</code></p><p class="notice success">{{ result }}</p></section>{% endif %}{% endblock %}
