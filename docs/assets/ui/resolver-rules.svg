<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Resolver rules sketch</title>
  <desc id="desc">Bike Garage rules screen showing separate Bike Slot Rules and Bike Assignment Rules, each ordered by priority.</desc>
  <style>
    .bg{fill:#f3f1ec}.shell{fill:#1d2423}.card{fill:#fffdf9;stroke:#dedbd3;stroke-width:1}.line{stroke:#dedbd3;stroke-width:1}.tab{fill:#e8e5de}.tabon{fill:#1d2423}.title{font:700 28px Arial,sans-serif;fill:#1d2423}.h2{font:700 17px Arial,sans-serif;fill:#1d2423}.body{font:14px Arial,sans-serif;fill:#5f625e}.small{font:12px Arial,sans-serif;fill:#7d807a}.nav{font:14px Arial,sans-serif;fill:#b8c0bc}.navon{font:700 14px Arial,sans-serif;fill:#fffdf9}.greenbg{fill:#e8f2ed}.amberbg{fill:#f6efe3}.button{fill:#1d2423}.white{font:700 14px Arial,sans-serif;fill:#fffdf9}.pill{font:700 11px Arial,sans-serif}
  </style>
  <rect class="bg" width="1440" height="900"/><rect class="shell" width="242" height="900"/>
  <text x="34" y="54" class="white" style="font-size:21px">BIKE GARAGE</text><text x="34" y="78" class="small" fill="#9aa39f">Jakez' garage</text><text x="42" y="148" class="nav">Dashboard</text><text x="42" y="206" class="nav">Activities</text><text x="42" y="264" class="nav">Bikes</text><rect x="18" y="286" width="206" height="42" rx="8" fill="#31413d"/><text x="42" y="312" class="navon">Rules</text><text x="42" y="370" class="nav">Settings</text>
  <text x="286" y="66" class="title">Resolver rules</text><text x="286" y="93" class="body">Bike Slot Rules create the required slots before Bike Assignment Rules fill them.</text><rect x="1230" y="48" width="166" height="42" rx="7" class="button"/><text x="1255" y="74" class="white">Add rule</text>
  <rect x="286" y="122" width="184" height="42" rx="8" class="tabon"/><text x="313" y="148" class="white">Bike Slot Rules · 2</text><rect x="482" y="122" width="226" height="42" rx="8" class="tab"/><text x="509" y="148" class="body">Bike Assignment Rules · 3</text>
  <text x="286" y="201" class="small">BIKE SLOT RULES · PRIORITY · DRAG TO REORDER</text><text x="286" y="224" class="small">The first matching rule determines the number and roles of the required bike slots.</text>
  <rect class="card" x="286" y="244" width="1110" height="144" rx="12"/><text x="314" y="279" class="small">10</text><text x="354" y="279" class="h2">Two recorded riders</text><rect x="1142" y="261" width="95" height="27" rx="14" class="greenbg"/><text x="1165" y="279" class="pill" fill="#2f765b">ENABLED</text><text x="354" y="309" class="body">WHEN Strava · Conny RIDER_RECORD is linked to the group</text><text x="354" y="337" class="body">THEN require 2 bike slots: Jakez recorded rider + Conny recorded rider</text><text x="314" y="362" class="small">⋮⋮</text>
  <rect class="card" x="286" y="406" width="1110" height="144" rx="12"/><text x="314" y="441" class="small">90</text><text x="354" y="441" class="h2">Recorded-rider fallback</text><rect x="1142" y="423" width="95" height="27" rx="14" class="greenbg"/><text x="1165" y="441" class="pill" fill="#2f765b">ENABLED</text><text x="354" y="471" class="body">WHEN any grouped activity is evaluated</text><text x="354" y="499" class="body">THEN require one recorded-rider slot for every linked RIDER_RECORD</text><text x="314" y="524" class="small">⋮⋮</text>
  <line x1="286" y1="590" x2="1396" y2="590" class="line"/><text x="286" y="628" class="h2">What happens next</text><text x="286" y="655" class="body">Bike Assignment Rules are evaluated separately for each unfilled slot. Their priority order never competes with Bike Slot Rules.</text>
  <rect x="286" y="695" width="1110" height="92" rx="12" class="amberbg"/><text x="314" y="728" class="h2" fill="#9a5d13">!</text><text x="342" y="728" class="h2">Review required: 1 of 2 expected bikes assigned</text><text x="342" y="754" class="body">Open the activity to choose the missing bike or add a Bike Assignment Rule.</text><text x="1234" y="742" class="pill" fill="#9a5d13">OPEN ACTIVITY</text>
  <text x="286" y="838" class="small">Disabled rules stay visible but are never evaluated. The other tab keeps its own priority order.</text>
</svg>
