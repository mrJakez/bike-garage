<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Bike Garage dashboard sketch</title>
  <desc id="desc">A desktop dashboard showing review items, bike cards, and a recent grouped ride.</desc>
  <style>
    .bg{fill:#f3f1ec}.shell{fill:#1d2423}.surface{fill:#fffdf9}.card{fill:#fffdf9;stroke:#dedbd3;stroke-width:1}.line{stroke:#dedbd3;stroke-width:1}.title{font:700 28px Arial,sans-serif;fill:#1d2423}.h2{font:700 17px Arial,sans-serif;fill:#1d2423}.body{font:14px Arial,sans-serif;fill:#5f625e}.small{font:12px Arial,sans-serif;fill:#7d807a}.nav{font:14px Arial,sans-serif;fill:#b8c0bc}.navon{font:700 14px Arial,sans-serif;fill:#fffdf9}.metric{font:700 25px Arial,sans-serif;fill:#1d2423}.ok{fill:#2f765b}.amber{fill:#bf7c28}.muted{fill:#aeb1aa}.pill{fill:#f6efe3}.tag{font:700 11px Arial,sans-serif;fill:#9a5d13}.white{font:700 14px Arial,sans-serif;fill:#fffdf9}.bike{stroke:#1d2423;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
