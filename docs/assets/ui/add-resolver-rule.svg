<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">Add resolver rule sketch</title>
  <desc id="desc">A Bike Garage form for adding a Bike Assignment Rule with conditions and an assignment action.</desc>
  <style>
    .bg{fill:#f3f1ec}.shell{fill:#1d2423}.card{fill:#fffdf9;stroke:#dedbd3;stroke-width:1}.field{fill:#fffdf9;stroke:#cfcac0;stroke-width:1}.line{stroke:#dedbd3;stroke-width:1}.title{font:700 28px Arial,sans-serif;fill:#1d2423}.h2{font:700 17px Arial,sans-serif;fill:#1d2423}.body{font:14px Arial,sans-serif;fill:#5f625e}.small{font:12px Arial,sans-serif;fill:#7d807a}.nav{font:14px Arial,sans-serif;fill:#b8c0bc}.navon{font:700 14px Arial,sans-serif;fill:#fffdf9}.green{fill:#2f765b}.greenbg{fill:#e8f2ed}.button{fill:#1d2423}.white{font:700 14px Arial,sans-serif;fill:#fffdf9}.pill{font:700 11px Arial,sans-serif}
  </style>
  <rect class="bg" width="1440" height="930"/><rect class="shell" width="242" height="930"/>
  <text x="34" y="54" class="white" style="font-size:21px">BIKE GARAGE</text><text x="34" y="78" class="small" fill="#9aa39f">Jakez' garage</text><text x="42" y="148" class="nav">Dashboard</text><text x="42" y="206" class="nav">Activities</text><text x="42" y="264" class="nav">Bikes</text><rect x="18" y="286" width="206" height="42" rx="8" fill="#31413d"/><text x="42" y="312" class="navon">Rules</text><text x="42" y="370" class="nav">Settings</text>
  <text x="286" y="57" class="small">RULES / ADD RULE</text><text x="286" y="91" class="title">Add resolver rule</text><text x="286" y="118" class="body">Bike Slot Rules run first. This rule type fills one available bike slot.</text><rect x="1082" y="54" width="132" height="42" rx="7" class="card"/><text x="1113" y="80" class="body">Cancel</text><rect x="1230" y="54" width="166" height="42" rx="7" class="button"/><text x="1261" y="80" class="white">Save rule</text>
  <rect class="card" x="286" y="154" width="1110" height="706" rx="12"/><text x="314" y="190" class="h2">Rule details</text><text x="314" y="218" class="small">RULE TYPE</text><rect x="314" y="232" width="514" height="44" rx="7" class="field"/><text x="330" y="260" class="body">Bike Assignment Rule</text><text x="790" y="260" class="small">⌄</text><text x="854" y="260" class="small">Fills a slot after Bike Slot Rules run</text><text x="314" y="314" class="small">NAME</text><rect x="314" y="328" width="1054" height="44" rx="7" class="field"/><text x="330" y="356" class="body">Jakez' road bike from Hammerhead</text><text x="314" y="410" class="small">PRIORITY WITHIN BIKE ASSIGNMENT RULES</text><rect x="314" y="424" width="180" height="44" rx="7" class="field"/><text x="330" y="452" class="body">10</text><text x="520" y="452" class="small">Runs before priority 20 in this rule type</text><line x1="314" y1="494" x2="1368" y2="494" class="line"/>
  <text x="314" y="529" class="h2">WHEN</text><text x="381" y="529" class="small">all conditions must match</text><rect x="314" y="547" width="1054" height="51" rx="8" class="greenbg"/><text x="334" y="578" class="body">Provider record is linked</text><text x="1050" y="578" class="h2">Hammerhead · Jakez</text><text x="1330" y="578" class="small">⌄</text><rect x="314" y="610" width="1054" height="51" rx="8" class="greenbg"/><text x="334" y="641" class="body">Extracted attribute</text><text x="1050" y="641" class="h2">FIT bike type = Road</text><text x="1330" y="641" class="small">⌄</text><rect x="314" y="673" width="1054" height="51" rx="8" class="greenbg"/><text x="334" y="704" class="body">Target recorded rider</text><text x="1050" y="704" class="h2">Jakez</text><text x="1330" y="704" class="small">⌄</text><text x="314" y="756" class="pill" fill="#2f765b">+ ADD CONDITION</text><line x1="314" y1="780" x2="1368" y2="780" class="line"/>
  <text x="314" y="815" class="h2">THEN</text><rect x="440" y="793" width="450" height="51" rx="8" class="field"/><text x="460" y="824" class="body">Assign bike</text><text x="850" y="824" class="small">⌄</text><rect x="918" y="793" width="450" height="51" rx="8" class="field"/><text x="938" y="824" class="body">Tarmac</text><text x="1328" y="824" class="small">⌄</text>
  <rect x="314" y="871" width="18" height="18" rx="4" class="green"/><text x="342" y="885" class="body">Stop after this matching Bike Assignment Rule</text>
</svg>
