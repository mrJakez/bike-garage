services:
  bike-garage:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/bike-garage.db
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      BIKE_GARAGE_PASSKEY_REGISTRATION_ENABLED: ${BIKE_GARAGE_PASSKEY_REGISTRATION_ENABLED:-false}
      BIKE_GARAGE_AUTH_DISABLED: ${BIKE_GARAGE_AUTH_DISABLED:-false}
      BIKE_GARAGE_SESSION_SECRET: ${BIKE_GARAGE_SESSION_SECRET:-}
      BIKE_GARAGE_PASSKEY_RP_ID: ${BIKE_GARAGE_PASSKEY_RP_ID:-}
      BIKE_GARAGE_PASSKEY_ORIGIN: ${BIKE_GARAGE_PASSKEY_ORIGIN:-}
      BIKE_GARAGE_PUBLIC_ORIGIN: ${BIKE_GARAGE_PUBLIC_ORIGIN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
