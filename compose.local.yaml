services:
  bike-garage:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/bike-garage.db
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
